[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cad-evoloop"
version = "0.1.0"
description = "Evidence-grounded cross-layer self-improvement for CAD agents"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "CAD-EvoLoop Contributors"}]
dependencies = [
  "Pillow>=10",
  "requests>=2.31",
]

[project.optional-dependencies]
autocad = ["pywin32>=306; sys_platform == 'win32'"]
geometry = [
  "cadquery-ocp>=7.8,<7.9",
  "numpy>=1.26,<2",
  "pyarrow>=17,<22",
  "scipy>=1.11,<2",
  "trimesh>=4.4,<5",
]
test = ["pytest>=8"]

[project.scripts]
cad-evoloop = "cad_evoloop.cli:main"
cad-evoloop-batch = "cad_evoloop.cli:batch"
cad-evoloop-ledger = "cad_evoloop.cli:ledger"
cad-evoloop-improve = "cad_evoloop.cli:improve"
cad-evoloop-eqc = "cad_evoloop.cli:eqc"
cad-evoloop-report = "cad_evoloop.cli:_report_campaign"
cad-evoloop-explorer-export = "cad_evoloop.cli:_export_explorer"
cad-evoloop-verifier-replay = "cad_evoloop.cli:_replay_verifier"
cad-evoloop-geometry-materialize = "cad_evoloop.cli:_materialize_geometry"
cad-evoloop-geometry-score = "cad_evoloop.cli:_score_geometry"
cad-evoloop-geometry-calibrate = "cad_evoloop.cli:_calibrate_geometry"
cad-evoloop-geometry-export = "cad_evoloop.cli:_export_geometry"
cad-evoloop-geometry-batch = "cad_evoloop.cli:_batch_geometry"
cad-evoloop-geometry-feature-backfill = "cad_evoloop.cli:_backfill_geometry_features"
cad-evoloop-geometry-feature-report = "cad_evoloop.cli:_report_geometry_features"
cad-evoloop-agent-geometry-batch = "cad_evoloop.cli:_batch_agent_geometry"
cad-evoloop-agent-geometry-start = "cad_evoloop.cli:_start_agent_geometry"
cad-evoloop-agent-geometry-status = "cad_evoloop.cli:_status_agent_geometry"
cad-evoloop-agent-geometry-report = "cad_evoloop.cli:_report_agent_geometry"
cad-evoloop-geometry-report = "cad_evoloop.cli:_report_geometry"
cad-evoloop-geometry-split = "cad_evoloop.cli:_split_geometry"
cad-evoloop-geometry-review-export = "cad_evoloop.cli:_export_geometry_review"
cad-evoloop-geometry-review-serve = "cad_evoloop.cli:_serve_geometry_review"
cad-evoloop-geometry-review-verify = "cad_evoloop.cli:_verify_geometry_reviews"
cad-evoloop-geometry-review-ingest = "cad_evoloop.cli:_ingest_geometry_reviews"
cad-evoloop-agent-clarification-submit = "cad_evoloop.cli:_submit_agent_clarification"
cad-evoloop-gt-trajectory-extract = "cad_evoloop.cli:_extract_gt_trajectories"
cad-evoloop-gt-trajectory-replay = "cad_evoloop.cli:_replay_gt"
cad-evoloop-gt-attribution-report = "cad_evoloop.cli:_report_gt_attribution"
cad-evoloop-gt-identifiability-probe = "cad_evoloop.cli:_probe_input_identifiability"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cad_evoloop = ["verification/schemas/*.json", "evaluation/schemas/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src", "evals/cad-1000-hours"]
testpaths = ["tests", "mcp/tests", "evals/cad-1000-hours"]
